[package]
name = "opal-kit"
version = "0.0.1"
edition = "2021"
license = "GPLv3"

[build-dependencies]
cc = "1.0"
bindgen = "0.65"

[dependencies]
clap = { version = "4.3.19", features = ["derive"] }
libc = "0.2"
nix = { version = "0.27" }
regex = "1.9.1"
errno = "0.3"
hexdump = "*"
env_logger = "0.10"
log = "0.4"
